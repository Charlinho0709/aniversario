<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#09001f"
    >

    <title>Controle da Missão</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="stars"></div>


<main class="page-wrapper admin-wrapper">

    <!-- LOGIN -->

    <section
        class="card admin-login"
        id="loginArea"
    >

        <div class="rocket">
            🛸
        </div>

        <p class="mission-label">
            ACESSO RESTRITO
        </p>

        <h1>
            Controle da Missão
        </h1>

        <p class="subtitle">
            Identificação do comandante necessária.
        </p>


        <form id="formLogin">

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="seu@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="senha">
                    Senha
                </label>

                <input
                    id="senha"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Sua senha"
                    required
                >

            </div>


            <button
                type="submit"
                id="btnLogin"
                class="primary-button"
            >
                🔐 ENTRAR
            </button>

        </form>


        <div
            id="loginStatus"
            class="status"
        ></div>

    </section>



    <!-- PAINEL -->

    <section
        class="admin-panel"
        id="adminArea"
    >

        <div class="admin-header">

            <div>

                <p class="mission-label">
                    MISSÃO EM ANDAMENTO
                </p>

                <h1>
                    Tripulação confirmada
                </h1>

            </div>


            <button
                id="btnLogout"
                class="secondary-button logout-button"
            >
                Sair
            </button>

        </div>


        <div class="stats">

            <div class="stat-card">

                <span>
                    CONFIRMAÇÕES
                </span>

                <strong id="totalConfirmacoes">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    TOTAL DE PESSOAS
                </span>

                <strong id="totalPessoas">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    ACOMPANHANTES
                </span>

                <strong id="totalAcompanhantes">
                    0
                </strong>

            </div>

        </div>


        <div class="admin-actions">

            <button
                id="btnAtualizar"
                class="secondary-button"
            >
                🔄 Atualizar
            </button>


            <button
                id="btnDownload"
                class="primary-button download-button"
            >
                📄 Baixar confirmados.txt
            </button>

        </div>


        <div
            id="adminStatus"
            class="status"
        ></div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Nome
                        </th>

                        <th>
                            Acomp.
                        </th>

                        <th>
                            Nomes
                        </th>

                        <th>
                            Telefone
                        </th>

                        <th>
                            Mensagem
                        </th>

                        <th>
                            Confirmação
                        </th>

                    </tr>

                </thead>


                <tbody id="listaConfirmados">

                </tbody>

            </table>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="admin.js"></script>

</body>

</html>
